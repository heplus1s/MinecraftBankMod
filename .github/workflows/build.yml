name: Build integrated mod
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check client/server packaging
        run: python3 scripts/check_embedded_ui.py
      - name: Compile and test core plus client
        run: bash gradlew --no-daemon build
      - name: Verify remapped release jar
        run: python3 scripts/check_release_jar.py
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-mod-jars
          path: build/libs/bankmod-1.0.29.jar
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-release]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integrated-mod-jars
          path: release-jars
      - name: Record checksum
        run: (cd release-jars && sha256sum bankmod-1.0.29.jar > SHA256SUMS.txt)
      - name: Publish versioned release without replacing existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.29 >/dev/null 2>&1; then
            echo "Release v1.0.29 already exists; refusing to replace it."
            exit 1
          fi
          gh release create v1.0.29 release-jars/bankmod-1.0.29.jar release-jars/SHA256SUMS.txt --target "$GITHUB_SHA" --title "v1.0.29 M0 统计与管理账目明细" --notes-file RELEASE_NOTES_1.0.29.md
