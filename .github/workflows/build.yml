name: Build bank mod
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run unit tests
        run: bash gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: bankmod-jars
          path: build/libs/*.jar
